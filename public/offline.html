<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#465fff">
        <title>InfraGuard Offline</title>
        <link rel="icon" href="/favicon.ico" sizes="any">
        <link rel="icon" type="image/png" href="/favicon.png">
        <style>
            :root {
                color-scheme: light;
                font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                background: #f8fbff;
                color: #0f172a;
            }

            * {
                box-sizing: border-box;
            }

            body {
                min-height: 100vh;
                margin: 0;
                display: grid;
                place-items: center;
                padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
                background:
                    radial-gradient(circle at top left, rgba(70, 95, 255, 0.16), transparent 34%),
                    linear-gradient(180deg, #ffffff, #f8fbff);
            }

            main {
                width: min(100%, 430px);
                border: 1px solid rgba(148, 163, 184, 0.28);
                border-radius: 32px;
                background: rgba(255, 255, 255, 0.92);
                padding: 32px;
                text-align: center;
                box-shadow: 0 24px 70px rgba(15, 23, 42, 0.10);
            }

            img {
                width: 82px;
                height: 82px;
                border-radius: 24px;
                box-shadow: 0 18px 36px rgba(70, 95, 255, 0.22);
            }

            h1 {
                margin: 24px 0 0;
                font-size: clamp(1.7rem, 8vw, 2.4rem);
                letter-spacing: -0.04em;
            }

            p {
                margin: 14px 0 0;
                color: #64748b;
                line-height: 1.7;
            }

            button {
                min-height: 48px;
                margin-top: 26px;
                border: 0;
                border-radius: 16px;
                background: #465fff;
                color: #ffffff;
                padding: 0 22px;
                font: inherit;
                font-weight: 700;
                cursor: pointer;
                box-shadow: 0 16px 32px rgba(70, 95, 255, 0.22);
            }

            .note {
                font-size: 0.86rem;
            }
        </style>
    </head>
    <body>
        <main>
            <img src="/icon-192.png" alt="InfraGuard">
            <h1>InfraGuard Offline</h1>
            <p>Live sensor data requires an internet connection.</p>
            <p class="note">Static interface may be cached, but real-time monitoring is unavailable offline.</p>
            <button type="button" onclick="window.location.reload()">Retry</button>
        </main>
    </body>
</html>
